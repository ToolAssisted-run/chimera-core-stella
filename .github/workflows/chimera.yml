name: chimera waterbox core

# The core as Chimera ships it: a sandboxed core.wbx package. Both jobs run
# only over the homebrew movie set vendored in tests/ (free to distribute)
# plus a synthesized Sega CD disc, so they need nothing provisioned and run
# on public runners.

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]
  workflow_dispatch:
  schedule:
    # 04:00 UTC. A nightly is published only when main moved since the last one;
    # the reusable workflow checks, so an unchanged core costs one idle run.
    - cron: '0 4 * * *'

# Keyed by the EVENT as well as the ref. The nightly schedule and a push to
# main are the same workflow on the same ref, so without the event in the key
# whichever starts second cancels the first - and because the publish depends
# on the gate that was cancelled, the release is skipped with nothing anywhere
# reporting a failure. They collide at all because GitHub runs these crons
# hours late: this one asks for 04:00 and starts around 08:30. A push still
# supersedes an older push on the same ref, which is what cancel-in-progress
# is for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

env:
  CHIMERA_REF: main

jobs:

  core-gate:
    # The fast half: the sandboxed core must emulate byte-identically to the
    # same sources built for the host, and survive a savestate round-trip
    # around every frame. No Chimera window or display involved.
    # Once per CPU, each on a runner of that CPU: a package is machine code for
    # one CPU, and miniBox's guest toolchain builds for the CPU it runs on.
    name: core gate (native == sandbox == rerecord) (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qt: gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt: gcc_arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera (for the miniBox waterbox host and toolchain)
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: false

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends meson ninja-build build-essential python3

      - name: Check out miniBox
        working-directory: chimera-checkout
        run: git submodule update --init extern/chimera-common-minibox

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          # the host library, plus the C++ guest toolchain Stella needs
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build the native reference and sandbox drivers
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-native

      - name: Build the waterbox core
        run: |
          MINIBOX_DIR="$PWD/chimera-checkout/extern/chimera-common-minibox" sh waterbox/setup-guest.sh \
            -- -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          ninja -C build/meson-guest
          # an aarch64 guest reads its thread pointer from the machine's slot, not
          # TPIDR_EL0 (miniBox's MACHINE-SPEC, "aarch64"); the host refuses one not rewritten so
          mb="$(sed -n "s/^minibox_dir = '\(.*\)'$/\1/p" build/guest-cross.ini)"
          [ "$(uname -m)" = x86_64 ] || python3 "$mb/source/guest/wbx-tp-rewrite.py" build/meson-guest/core.wbx

      - name: Core gate over the homebrew movie set
        run: ./waterbox/run-gate.sh


      - name: Upload core.wbx
        uses: actions/upload-artifact@v7
        with:
          name: core-wbx-${{ matrix.arch }}
          path: |
            build/meson-guest/core.wbx
            waterbox/waterbox.config
          retention-days: 90

  frontend-gate:
    # The other half: the package running inside the real frontend (Chimera
    # window, run headless, through the generic waterbox adapter). The
    # emulated 68K RAM must match the native reference, a setting must arrive
    # through the window's settings, and the package's default keybinds must
    # become the frontend's.
    # Once per CPU, each on a runner of that CPU: a package is machine code for
    # one CPU, and miniBox's guest toolchain builds for the CPU it runs on.
    name: frontend gate (Chimera) (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
            qt: gcc_64
          - arch: aarch64
            runner: ubuntu-24.04-arm
            qt: gcc_arm64
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Check out Chimera
        uses: actions/checkout@v6
        with:
          repository: ToolAssisted-run/chimera
          ref: ${{ env.CHIMERA_REF }}
          path: chimera-checkout
          submodules: recursive

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ~/qt
          key: qt-6.12.0-linux-${{ matrix.arch }}-aqt-3.3.0

      - name: Build Chimera (the engine, chimera-run and the window)
        run: chimera-checkout/tools/ci-chimera.sh "$HOME/qt"

      - name: Build the native reference
        run: |
          meson setup build/meson-native -Dminibox_dir="$PWD/chimera-checkout/extern/chimera-common-minibox"
          # run-native only: the frontend gate compares Chimera against the
          # native reference and never runs the sandbox driver, which would
          # drag in a miniBox host build this job has no reason to do.
          ninja -C build/meson-native run-native

      - name: Cache the guest toolchain
        uses: actions/cache@v4
        with:
          path: |
            chimera-checkout/extern/chimera-common-minibox/build/meson-linux
            chimera-checkout/extern/chimera-common-minibox/build/meson-cpp
          key: guest-cpp-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/.git') }}-${{ hashFiles('chimera-checkout/extern/chimera-common-minibox/meson.build') }}

      - name: Build miniBox (host + guest toolchain)
        run: |
          mb="$PWD/chimera-checkout/extern/chimera-common-minibox"
          # the host library, plus the C++ guest toolchain Stella needs
          [ -f "$mb/build/meson-linux/build.ninja" ] || meson setup "$mb/build/meson-linux" "$mb"
          meson compile -C "$mb/build/meson-linux"
          [ -f "$mb/build/meson-cpp/build.ninja" ] || meson setup "$mb/build/meson-cpp" "$mb" -Dguest_cpp=true
          meson compile -C "$mb/build/meson-cpp"

      - name: Build and install the waterbox core package
        # The commit is the core's authoritative version: this build is the one
        # that publishes the artifact, so what it stamps is what a movie can
        # cite. A package built by hand stamps "+local" instead.
        env:
          CORE_VERSION: ${{ github.sha }}
        run: ./waterbox/build-package.sh -m "$PWD/chimera-checkout/extern/chimera-common-minibox" -r "$PWD/chimera-checkout"

      - name: Frontend gate
        run: ./waterbox/tests/run-frontend.sh --chimera-root "$GITHUB_WORKSPACE/chimera-checkout"

      - name: Publish the core package
        # one core.wbx, one package, four machines inside it
        uses: actions/upload-artifact@v7
        with:
          name: stella-${{ github.sha }}-${{ matrix.arch }}
          path: chimera-checkout/build/Cores/stella.chimeraCore
          if-no-files-found: error

      - name: Upload the frontend work dir on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: frontend-gate-work-${{ matrix.arch }}
          path: waterbox/tests/work/

  publish:
    # What the gates passed, published as this core's own release: an immutable
    # `nightly-YYYY-MM-DD` from the scheduled run, or from one started by hand.
    # A push to main publishes nothing. Chimera ships no cores and downloads
    # none: a user downloads the package from here and puts it in Chimera's
    # Cores folder.
    #
    # The logic is Chimera's tools/publish-core.sh, called through one reusable
    # workflow, so all fifteen cores publish the same way and there is one place
    # to change it.
    name: publish
    needs: [ core-gate, frontend-gate ]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    uses: ToolAssisted-run/chimera/.github/workflows/publish-core.yml@main
    with:
      core-id: stella
      artifact: stella-${{ github.sha }}
      package: stella.chimeraCore
      arches: x86_64 aarch64
